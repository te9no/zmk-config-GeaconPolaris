# Apply last, and only to the two explicitly named ESB artifacts.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
# Upstream enumerates source 0; one slot also preserves battery/OLED index 0.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=0
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=1
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=56
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3
CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=16
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
# Functional test, not a latency benchmark. No raw key/analog/SPI frame dumps.
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_LOG_MAX_LEVEL=3
CONFIG_SPI_THREE_WIRE_GPIO_LOG_LEVEL_WRN=y
CONFIG_ZMK_SLEEP=n
# BLE API users still cannot run over this USB-only ESB experiment.
CONFIG_ZMK_BLE_MANAGEMENT=n
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n
# Both halves must use the relay-capable ESB fork and matching fragment settings.
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_ESB_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SETTINGS_RPC=y
# Watchdog providers are not part of the dedicated ESB shields yet.
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=n
