CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_INIT_PRIORITY=75
CONFIG_INPUT=y

CONFIG_ADC_ADS1220=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_INPUT_ANALOG_AXIS_HIRES_SETTINGS=n
CONFIG_INPUT_ANALOG_AXIS_HIRES_THREAD_STACK_SIZE=2048
CONFIG_INPUT_ANALOG_AXIS_HIRES_THREAD_PRIORITY=9

CONFIG_MULTITHREADING=y
CONFIG_PM_DEVICE=y

CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ADC_LOG_LEVEL_WRN=y
CONFIG_INPUT_LOG_LEVEL_WRN=y
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=128
CONFIG_LOG_BUFFER_SIZE=4096

# LPPS runs on the central half, so it must retain the IQS9151 Studio handler
# used to query an IQS module attached to the peripheral half.
CONFIG_ZMK_SETTINGS_RPC=n
CONFIG_ZMK_SETTINGS_RPC_STUDIO=n

# ADS1220 transactions can occupy the system work queue longer than the other
# input modules. Keep its established headroom, but inherit the larger display,
# input, Bluetooth RX, and low-priority stacks from Polaris_L_Base.conf.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
