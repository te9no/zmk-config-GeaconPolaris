CONFIG_SPI=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SWAP_XY=n
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=14
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_PMW3610_LOG_LEVEL_INF=y
CONFIG_SPI_THREE_WIRE_GPIO_LOG_LEVEL_INF=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
CONFIG_ZMK_INPUT_PROCESSOR_KEYBIND=y
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_INPUT_PINNACLE=y
CONFIG_SETTINGS=y
CONFIG_ZMK_ZEROSHIFT=y
# Profile saves and split replies can run together on the system workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_USB_DEVICE_PRODUCT="POLARISZS-R"

CONFIG_I2C_GPIO=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ADC_ADS1220=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_INPUT_ANALOG_AXIS_HIRES_SETTINGS=n
